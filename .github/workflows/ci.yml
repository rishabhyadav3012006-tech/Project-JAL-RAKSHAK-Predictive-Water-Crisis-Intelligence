name: JAL-RAKSHAK CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Linting, Static Typing & Pytest Suite
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jal-rakshak/backend/requirements.txt
          pip install pytest pytest-cov

      - name: Execute Pytest Suite with Coverage
        run: |
          cd jal-rakshak/backend
          PYTHONPATH=.:../ai-engine:../iot-simulator pytest -v --disable-warnings

  # 2. Frontend Linting & Production Build
  frontend-build:
    name: Frontend Build & Asset Verification (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: jal-rakshak/frontend/package-lock.json

      - name: Install Frontend Packages
        run: |
          cd jal-rakshak/frontend
          npm ci

      - name: Execute Vite Production Minification
        run: |
          cd jal-rakshak/frontend
          npm run build

  # 3. Docker Compose Validation
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cd jal-rakshak
          docker compose config
