# Netlify Monorepo Configuration for JAL-RAKSHAK
# This ensures that when deploying from the repository root, Netlify builds the frontend SPA.
[build]
  base = "jal-rakshak/frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
